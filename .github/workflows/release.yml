name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish only a commit whose ci run succeeded. A red main leaves the tag and the draft release behind;
  # rerun the failed jobs of this run once ci is green.
  ci_gate:
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for ci on this commit
        run: sh scripts/wait-for-ci.sh

  package:
    needs: [release_please, ci_gate]
    if: needs.release_please.outputs.release_created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.release_please.outputs.version }}
      ref: ${{ needs.release_please.outputs.tag_name }}

  publish:
    needs: [release_please, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release_please.outputs.tag_name }}
      V: ${{ needs.release_please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.release_please.outputs.version }}
          path: out
      - name: Upload assets and publish the release
        run: |
          set -eux
          gh release upload "$TAG" "out/unmouse-$V-macos-universal.tar.gz" out/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
