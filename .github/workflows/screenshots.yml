name: screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - examples/**
      - Cargo.lock

concurrency:
  group: screenshots
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    # pinned so the rendered pixels stay stable
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: bot/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        run: |
          set -eux
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Render the screenshots
        run: cargo run --release --locked --example screenshots -- --out docs/images
      - name: Open a pull request when the images changed
        run: |
          set -eux
          if [ -z "$(git status --porcelain -- docs/images)" ]; then
            echo "screenshots are up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add docs/images
          git commit -m 'docs: update screenshots'
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git push --force-with-lease="$BRANCH:origin/$BRANCH" origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title 'docs: update screenshots' --body 'Regenerated by the screenshots workflow.'
          fi
