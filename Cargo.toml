[package]
name = "unmouse"
version = "0.1.0"
edition = "2024"
description = "Control the mouse pointer from the keyboard on macOS"
license = "MIT"
repository = "https://github.com/Asugawara/unmouse"
homepage = "https://github.com/Asugawara/unmouse"
readme = "README.md"
keywords = ["macos", "mouse", "keyboard", "accessibility", "productivity"]
categories = ["command-line-utilities", "accessibility"]
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"

[profile.release]
panic = "abort"

[dev-dependencies]
png = "0.18.1"
